<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f17">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Chief</title>
<style>
  /* A night deck. Family colour is the load-bearing signal — you should see that a
     Claude build was checked by a Grok before you read a single word. */
  :root {
    --void:#05070A; --deck:#0A0E14; --panel:#0F141C; --raised:#151C26;
    --rule:#1D2734; --rule-hi:#2C3A4D;
    --ink:#F2F6FB; --dim:#7E90A8; --faint:#4A5A70;
    --ok:#00E5A0; --warn:#FFC53D; --bad:#FF4D4D; --run:#2E9BFF;
    --mono: ui-monospace,"SF Mono",Menlo,monospace;
    --sans: -apple-system,system-ui,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);
       line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}

  header{position:sticky;top:0;z-index:20;background:rgba(5,7,10,.94);
         backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);
         padding:14px 16px calc(14px + env(safe-area-inset-top)) 16px;padding-top:calc(14px + env(safe-area-inset-top))}
  .brand{font-family:var(--mono);font-weight:700;font-size:17px;letter-spacing:-.02em;
         display:flex;align-items:center;gap:9px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 9px var(--ok)}

  nav{display:flex;gap:2px;margin-top:12px;background:var(--panel);border:1px solid var(--rule);padding:2px}
  nav button{flex:1;background:none;border:0;color:var(--faint);font-family:var(--mono);
             font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
             padding:9px 4px;cursor:pointer}
  nav button.on{background:var(--raised);color:var(--ink)}

  main{padding:16px;max-width:900px;margin:0 auto}
  .tab{display:none} .tab.on{display:block}
  h2{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
     color:var(--faint);font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:10px}
  h2::after{content:"";flex:1;height:1px;background:var(--rule)}

  /* ── talk ── */
  .thread{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
  .msg{padding:13px 15px;border:1px solid var(--rule);background:var(--panel);
       font-size:15px;line-height:1.55}
  .msg.you{background:var(--raised);border-left:2px solid var(--ink)}
  .msg.chief{border-left:2px solid var(--ok)}
  .msg.holding{border-left:2px solid var(--warn);color:var(--dim);font-style:italic}
  .msg .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
            color:var(--faint);margin-bottom:6px;display:flex;justify-content:space-between}
  .msg .who .t{color:var(--warn)}
  .ask{display:flex;gap:8px;position:sticky;bottom:0;background:var(--void);
       padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
  .ask input{flex:1;background:var(--panel);border:1px solid var(--rule-hi);color:var(--ink);
             padding:14px;font-size:16px;font-family:var(--sans);outline:none}
  .ask input:focus{border-color:var(--ok)}
  .ask button{background:var(--ok);border:0;color:#04120C;font-weight:700;padding:0 20px;
              font-family:var(--mono);font-size:13px;cursor:pointer}
  .ask button:disabled{opacity:.4}
  /* the "give the team a job" box sits at the TOP of the work tab, not stuck to the
     bottom like the chat composer */
  .ask.give{position:static;padding:0 0 6px}
  .givemsg{color:var(--dim);font-size:13px;min-height:18px;padding:0 0 10px}

  /* ── jobs ── */
  .job{border:1px solid var(--rule);background:var(--panel);margin-bottom:10px}
  .job .top{padding:13px 15px;display:flex;gap:11px;align-items:flex-start;cursor:pointer}
  .stripe{width:3px;align-self:stretch;flex-shrink:0}
  .job .task{font-weight:600;font-size:15px;flex:1;min-width:0}
  .job .sub{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:4px}
  .pill{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;
        padding:4px 8px;white-space:nowrap;text-transform:uppercase}
  .pill.ok{color:var(--ok);background:rgba(0,229,160,.12)}
  .pill.bad{color:var(--bad);background:rgba(255,77,77,.12)}
  .pill.running{color:var(--run);background:rgba(46,155,255,.12)}
  .pill.waiting{color:var(--warn);background:rgba(255,197,61,.12)}
  .blocked{margin:0 15px 13px;padding:11px 13px;background:rgba(255,197,61,.09);
           border-left:2px solid var(--warn);font-size:13.5px;color:#FFE08A}
  .detail{display:none;border-top:1px solid var(--rule);padding:13px 15px;background:var(--deck)}
  .detail.on{display:block}
  .ev{font-family:var(--mono);font-size:11.5px;color:var(--dim);padding:3px 0}
  .ev b{color:var(--faint);font-weight:400}
  .vs{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .v{font-family:var(--mono);font-size:10.5px;padding:4px 8px;border-left:2px solid}
  .empty{color:var(--faint);text-align:center;padding:44px 20px;font-size:14px}

  /* ── fleet ── */
  .seat{border:1px solid var(--rule);background:var(--panel);padding:14px 15px;
        margin-bottom:8px;display:flex;align-items:center;gap:12px}
  .seat .nm{font-family:var(--mono);font-weight:700;font-size:15px;flex:1}
  .seat .md{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .bar{height:3px;background:var(--rule);margin-top:7px;overflow:hidden;width:100%}
  .bar i{display:block;height:100%}
  .spend{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:right}

  /* ── projects ── */
  .proj{border:1px solid var(--rule);background:var(--panel);padding:16px;margin-bottom:12px}
  .proj h3{margin:0 0 3px;font-size:17px}
  .proj .meta{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:14px}
  .plan{list-style:none;padding:0;margin:0}
  .plan li{padding:9px 0 9px 20px;border-left:1px solid var(--rule);position:relative;font-size:14px}
  .plan li::before{content:"";position:absolute;left:-4px;top:15px;width:7px;height:7px;
                   background:var(--faint);border:2px solid var(--panel)}
  .plan li.done::before{background:var(--ok)} .plan li.done{color:var(--faint);text-decoration:line-through}
  .plan li.active::before{background:var(--run);box-shadow:0 0 8px var(--run)}
  .plan li.blocked::before{background:var(--warn)}
  .plan .why{font-size:12px;color:var(--warn);margin-top:2px}
  .mem{}
  .mem div{font-size:13px;color:var(--dim);padding:7px 0;border-top:1px solid var(--rule)}
  .mem div:first-child{border-top:0}
  .mem .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
          color:var(--faint);margin-right:8px}

  /* ── project dashboard ── */
  .pswitch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .pchip{background:var(--panel);border:1px solid var(--rule);color:var(--dim);
         font-family:var(--mono);font-size:12px;padding:8px 14px;cursor:pointer;display:flex;
         align-items:center;gap:7px}
  .pchip.on{background:var(--raised);border-color:var(--rule-hi);color:var(--ink)}
  .pchip .c{background:var(--run);color:#04120C;font-weight:700;border-radius:9px;
            padding:0 6px;font-size:10px;min-width:16px;text-align:center}
  .phead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .phead h3{margin:0;font-size:19px}
  .pmeta{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .pcard{border:1px solid var(--rule);background:var(--panel);padding:15px;margin-bottom:12px}
  .cardh{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
         color:var(--faint);margin-bottom:12px}
  .tsec{margin-bottom:14px}
  .th{font-family:var(--mono);font-size:11px;color:var(--run);margin:0 0 6px;font-weight:700}
  .todo{display:flex;align-items:flex-start;gap:9px;padding:6px 0;font-size:14px;color:var(--ink)}
  .todo .box{cursor:pointer;color:var(--dim);user-select:none;line-height:1.35}
  .todo .tx{flex:1;cursor:pointer;line-height:1.35}
  .todo .del{color:var(--faint);cursor:pointer;opacity:0;padding:0 4px;font-size:16px}
  .todo:hover .del{opacity:1}
  .todo.done .tx{color:var(--faint);text-decoration:line-through}
  .todo.done .box{color:var(--ok)}
  .todo.you .tx::after{content:"you";font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
         color:var(--warn);border:1px solid var(--warn);border-radius:3px;padding:1px 4px;margin-left:8px;
         vertical-align:middle;text-decoration:none;display:inline-block}
  .addtodo{display:flex;gap:6px;margin-top:12px;border-top:1px solid var(--rule);padding-top:12px}
  .addtodo .tsecin{width:130px;flex:none}
  .addtodo input{background:var(--deck);border:1px solid var(--rule-hi);color:var(--ink);
         padding:10px;font-size:14px;font-family:var(--sans);outline:none;flex:1;min-width:0}
  .addtodo input:focus{border-color:var(--ok)}
  .addtodo button{background:var(--raised);border:1px solid var(--rule-hi);color:var(--ink);
         font-family:var(--mono);font-size:12px;padding:0 16px;cursor:pointer}
  .empty2{color:var(--faint);font-size:13px;padding:6px 0}
  .tl{display:flex;flex-direction:column}
  .tli{display:flex;align-items:flex-start;gap:12px;padding:9px 0 9px 6px;position:relative;font-size:14px}
  .tli .dotp{width:8px;height:8px;border-radius:50%;background:var(--faint);margin-top:5px;flex:none}
  .tli.done .dotp{background:var(--ok)} .tli.done b{color:var(--faint);text-decoration:line-through}
  .tli.active .dotp{background:var(--run);box-shadow:0 0 8px var(--run)}
  .tli.blocked .dotp{background:var(--warn)}
  .tlx{flex:1}
  .tli .ph{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-left:8px;text-transform:uppercase}
  .tli .st{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase}
  .tli .why{font-size:12px;color:var(--warn);margin-top:2px}
  .files{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .att{width:96px;text-decoration:none;color:var(--dim);font-size:10px;display:block;overflow:hidden}
  .att img{width:96px;height:72px;object-fit:cover;border:1px solid var(--rule);display:block}
  .att span{display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .att.file{width:96px;height:72px;border:1px solid var(--rule);background:var(--deck);
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .att.file .fi{font-size:26px;color:var(--faint)}
  .upl{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--dim);
       border:1px dashed var(--rule-hi);padding:10px 16px;cursor:pointer}
  .upl:hover{color:var(--ink);border-color:var(--ok)}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> CHIEF</div>
  <nav>
    <button class="on" data-t="talk">Talk</button>
    <button data-t="work">Work</button>
    <button data-t="fleet">Fleet</button>
    <button data-t="proj">Projects</button>
  </nav>
</header>

<main>
  <section id="talk" class="tab on">
    <div class="thread" id="thread"></div>
    <form class="ask" id="ask">
      <input id="in" placeholder="Talk to Chief…" autocomplete="off">
      <button id="send">Send</button>
    </form>
  </section>

  <section id="work" class="tab">
    <h2>What's happening</h2>
    <form class="ask give" id="give">
      <input id="giveIn" placeholder="Give the team a job to build…" autocomplete="off">
      <button id="giveBtn">Build it</button>
    </form>
    <div id="giveMsg" class="givemsg"></div>
    <div id="jobs"></div>
  </section>
  <section id="fleet" class="tab"><h2>The fleet</h2><div id="seats"></div></section>
  <section id="proj" class="tab"><h2>Projects</h2><div id="projects"></div></section>
</main>

<script>
const $ = s => document.querySelector(s);
let LAST_Q = "", LAST_A = "";

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); $('#' + b.dataset.t).classList.add('on');
  if (b.dataset.t !== 'talk') refresh();
});

function bubble(cls, who, text, t) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = `<div class="who"><span>${who}</span>${t ? `<span class="t">${t}</span>` : ''}</div>${esc(text)}`;
  $('#thread').appendChild(d);
  d.scrollIntoView({behavior:'smooth', block:'end'});
  return d;
}
const esc = s => (s||'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

$('#ask').onsubmit = async e => {
  e.preventDefault();
  const text = $('#in').value.trim(); if (!text) return;
  $('#in').value = ''; $('#send').disabled = true;
  bubble('you', 'You', text);

  // Ask FIRST whether this needs thinking, so we only show a holding line when we're
  // actually going to make him wait. Saying "let me think about that" in response to
  // "stop" is a lie, and a slightly insulting one.
  let hold = null;
  try {
    const pre = await fetch('/api/willthink?q=' + encodeURIComponent(text)).then(r => r.json());
    if (pre.thinking) hold = bubble('holding', 'Chief', pre.holding);
  } catch (e) { /* if the check fails, just don't pretend */ }

  try {
    const r = await fetch('/api/say', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, last_question: LAST_Q, last_answer: LAST_A})
    }).then(r => r.json());

    if (hold) hold.remove();
    const tag = r.tier === 'deep' ? `dug in · ${r.seconds}s`
              : r.tier === 'think' ? `thought · ${r.seconds}s` : '';
    bubble('chief', 'Chief', r.reply, tag);
    LAST_Q = text; LAST_A = r.reply;
  } catch (err) {
    if (hold) hold.remove();
    bubble('chief', 'Chief', "Couldn't reach the machine. Is it still running?");
  }
  $('#send').disabled = false; $('#in').focus();
};

// Give the team a real job. Generates a one-time nonce so a double-tap can't start
// the same work twice — the server dedupes on it.
$('#give').onsubmit = async e => {
  e.preventDefault();
  const text = $('#giveIn').value.trim(); if (!text) return;
  const nonce = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
  $('#giveIn').value = ''; $('#giveBtn').disabled = true;
  $('#giveMsg').textContent = 'Sending it over…';
  try {
    const r = await fetch('/api/dispatch', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, nonce})
    }).then(r => r.json());
    $('#giveMsg').textContent = r.reply || r.error || '';
    refresh();
    // Poll quickly for a bit so the work appears to move in near-real-time.
    let ticks = 0;
    const fast = setInterval(() => { refresh(); if (++ticks > 40) clearInterval(fast); }, 1500);
  } catch (err) {
    $('#giveMsg').textContent = "Couldn't reach the machine. Is it still running?";
  }
  $('#giveBtn').disabled = false; $('#giveIn').focus();
};

async function refresh() {
  const s = await fetch('/api/state').then(r => r.json());

  $('#jobs').innerHTML = s.jobs.length ? s.jobs.map(j => `
    <div class="job">
      <div class="top" onclick="this.parentNode.querySelector('.detail').classList.toggle('on')">
        <div class="stripe" style="background:${j.color}"></div>
        <div style="flex:1;min-width:0">
          <div class="task">${esc(j.task_name || j.request)}</div>
          <div class="sub">${j.builder_seat} · ${j.builder_family}</div>
        </div>
        <span class="pill ${j.tone}">${j.status_word}</span>
      </div>
      ${j.blocked_because ? `<div class="blocked">${esc(j.blocked_because)}</div>` : ''}
      <div class="detail">
        ${j.events.map(e => `<div class="ev"><b>${esc(e.what)}</b>${e.note ? ' — ' + esc(e.note) : ''}</div>`).join('') || '<div class="ev">nothing yet</div>'}
        ${j.verdicts.length ? `<div class="vs">${j.verdicts.map(v => `
          <span class="v" style="border-color:${v.color};color:${v.color}">
            ${v.verdict==='pass'?'✓':v.verdict==='fail'?'✗':'?'} ${v.reviewer_seat} · ${v.role}
          </span>`).join('')}</div>` : ''}
      </div>
    </div>`).join('') : '<div class="empty">Nothing yet. Ask Chief to build something.</div>';

  $('#seats').innerHTML = s.seats.map(x => {
    const cap = x.daily_cap_cents;
    const pct = cap ? Math.min(100, (x.spent_today_cents / cap) * 100) : 0;
    return `<div class="seat">
      <div class="stripe" style="background:${x.color};height:34px;width:3px"></div>
      <div style="flex:1">
        <div class="nm">${x.id}</div>
        <div class="md">${x.model}</div>
        ${cap ? `<div class="bar"><i style="width:${pct}%;background:${pct>85?'var(--bad)':x.color}"></i></div>` : ''}
      </div>
      <div class="spend">${cap ? `${(x.spent_today_cents/100).toFixed(2)} / ${(cap/100).toFixed(2)}` : 'included'}</div>
    </div>`;
  }).join('');

  window.STATE = s;
  renderProjects(s);
}

// ── The project dashboard: switch projects, and per project see its todos
//    (grouped into your own sections), timeline, files, and what it has learned. ──
let SELECTED_PROJECT = null;

function renderProjects(s) {
  const box = $('#projects');
  if (!s || !s.projects || !s.projects.length) {
    box.innerHTML = '<div class="empty">No projects yet.</div>'; return;
  }
  if (!SELECTED_PROJECT || !s.projects.find(p => p.id === SELECTED_PROJECT))
    SELECTED_PROJECT = s.projects[0].id;
  const p = s.projects.find(x => x.id === SELECTED_PROJECT);

  const chips = s.projects.map(x => `
    <button class="pchip ${x.id===SELECTED_PROJECT?'on':''}" onclick="selectProject('${x.id}')">
      ${esc(x.name)}${x.todo_open ? `<span class="c">${x.todo_open}</span>` : ''}
    </button>`).join('');

  const todos = p.todos.length ? p.todos.map(g => `
    <div class="tsec">
      <div class="th">${esc(g.section)}</div>
      ${g.items.map(t => `
        <div class="todo ${t.done?'done':''} ${t.owner_only?'you':''}">
          <span class="box" onclick="toggleTodo(${t.id})">${t.done?'☑':'☐'}</span>
          <span class="tx" onclick="toggleTodo(${t.id})">${esc(t.text)}</span>
          <span class="del" onclick="deleteTodo(${t.id})" title="remove">×</span>
        </div>`).join('')}
    </div>`).join('') : '<div class="empty2">No todos yet — add one below.</div>';

  const timeline = p.plan.length ? `<div class="tl">${p.plan.map(i => `
    <div class="tli ${i.status}"><span class="dotp"></span>
      <div class="tlx"><b>${esc(i.title)}</b>${i.phase?`<span class="ph">${esc(i.phase)}</span>`:''}
        ${i.blocked_on?`<div class="why">${esc(i.blocked_on)}</div>`:''}</div>
      <span class="st">${esc(i.status)}</span>
    </div>`).join('')}</div>` : '<div class="empty2">No timeline yet.</div>';

  const files = (p.attachments && p.attachments.length) ? `<div class="files">${p.attachments.map(a =>
    a.kind==='image'
      ? `<a class="att" href="/api/attachments/${a.id}" target="_blank"><img src="/api/attachments/${a.id}" alt=""><span>${esc(a.filename)}</span></a>`
      : `<a class="att file" href="/api/attachments/${a.id}" target="_blank"><span class="fi">▤</span><span>${esc(a.filename)}</span></a>`
    ).join('')}</div>` : '';

  const mem = p.memory.length ? `<div class="mem">${p.memory.map(m =>
    `<div><span class="k">${esc(m.kind)}</span>${esc(m.fact)}</div>`).join('')}</div>`
    : '<div class="empty2">Nothing learned yet.</div>';

  box.innerHTML = `
    <div class="pswitch">${chips}</div>
    <div class="phead"><h3>${esc(p.name)}</h3>
      <div class="pmeta">${p.todo_open||0} open · ${p.job_count} job${p.job_count===1?'':'s'}</div></div>

    <div class="pcard">
      <div class="cardh">Todos</div>
      ${todos}
      <form class="addtodo" onsubmit="return addTodo(event,'${p.id}')">
        <input class="tsecin" placeholder="Section (Now, Later…)" list="secs-${p.id}" autocomplete="off">
        <datalist id="secs-${p.id}">${p.todos.map(g=>`<option value="${esc(g.section)}">`).join('')}</datalist>
        <input class="ttextin" placeholder="Add a todo…" autocomplete="off">
        <button>Add</button>
      </form>
    </div>

    <div class="pcard"><div class="cardh">Timeline</div>${timeline}</div>

    <div class="pcard">
      <div class="cardh">Files &amp; images</div>
      ${files}
      <label class="upl">＋ Upload an image or file
        <input type="file" style="display:none" onchange="uploadFile(this,'${p.id}')">
      </label>
    </div>

    <div class="pcard"><div class="cardh">What this project knows</div>${mem}</div>`;
}

window.selectProject = id => { SELECTED_PROJECT = id; renderProjects(window.STATE); };
window.toggleTodo = async id => { await fetch('/api/todos/'+id+'/toggle',{method:'POST'}); refresh(); };
window.deleteTodo = async id => { await fetch('/api/todos/'+id+'/delete',{method:'POST'}); refresh(); };
window.addTodo = async (e, pid) => {
  e.preventDefault();
  const f = e.target;
  const text = f.querySelector('.ttextin').value.trim(); if (!text) return false;
  const section = f.querySelector('.tsecin').value.trim();
  await fetch('/api/projects/'+pid+'/todos', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text, section})
  });
  f.querySelector('.ttextin').value = '';
  refresh();
  return false;
};
window.uploadFile = async (input, pid) => {
  if (!input.files || !input.files[0]) return;
  const fd = new FormData();
  fd.append('file', input.files[0]);
  fd.append('project_id', pid);
  const lbl = input.parentNode; const t = lbl.firstChild.textContent;
  lbl.firstChild.textContent = 'Uploading…';
  try { await fetch('/api/upload', {method:'POST', body:fd}); } finally { lbl.firstChild.textContent = t; }
  input.value = '';
  refresh();
};

refresh();
setInterval(() => { if (!$('#talk').classList.contains('on')) refresh(); }, 4000);
bubble('chief', 'Chief', "I'm here. Ask me anything, or tell me what to build.");
</script>
</body>
