<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chief — Voice</title>
<style>
  :root{
    --void:#05070A; --panel:#0F141C; --raised:#151C26; --rule:#1D2734;
    --ink:#F2F6FB; --dim:#7E90A8; --faint:#4A5A70;
    --live:#00E5A0; --think:#FFC53D; --bad:#FF4D4D;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --sans:-apple-system,system-ui,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);
       display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
       padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

  header{padding:16px;border-bottom:1px solid var(--rule);display:flex;
         align-items:center;justify-content:space-between}
  .brand{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:-.02em}
  .state{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
         color:var(--faint);display:flex;align-items:center;gap:7px}
  .state i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:block}
  .state.live i{background:var(--live);box-shadow:0 0 10px var(--live);animation:pulse 2s infinite}
  .state.think i{background:var(--think);box-shadow:0 0 10px var(--think);animation:pulse .8s infinite}
  .state.bad i{background:var(--bad)}
  @keyframes pulse{50%{opacity:.35}}

  main{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
  .turn{max-width:88%;padding:13px 16px;font-size:16px;line-height:1.55;border:1px solid var(--rule)}
  .turn.you{align-self:flex-end;background:var(--raised);border-left:2px solid var(--ink)}
  .turn.chief{align-self:flex-start;background:var(--panel);border-left:2px solid var(--live)}
  .turn.hold{align-self:flex-start;background:transparent;border-left:2px solid var(--think);
             color:var(--dim);font-style:italic}
  .turn .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
             color:var(--faint);margin-bottom:6px}
  .hint{color:var(--faint);text-align:center;margin:auto;max-width:30ch;line-height:1.6;font-size:14px}

  footer{padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--rule)}
  .mic{width:100%;padding:20px;border:0;background:var(--live);color:#04120C;
       font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.1em;
       text-transform:uppercase;cursor:pointer}
  .mic.on{background:var(--bad);color:#fff}
  .mic:disabled{opacity:.4}
  .note{font-size:11.5px;color:var(--faint);text-align:center;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="brand">CHIEF</div>
  <div class="state" id="state"><i></i><span id="stateLabel">off</span></div>
</header>

<main id="log">
  <div class="hint" id="hint">
    Tap the button once.<br>Then just talk — no button holding, and you can cut me off any time.
  </div>
</main>

<footer>
  <button class="mic" id="mic">Start talking</button>
  <div class="note" id="note">Everything you say goes to Chief. Chief decides, and can push back.</div>
</footer>

<script>
const $ = s => document.querySelector(s);
let pc = null, stream = null, dc = null, live = false;
let lastSaid = "", lastAnswer = "";

// The realtime SESSION has tool_choice:"required" (see /api/voice/token) so that
// nothing Neill says can slip past Chief. But that setting applies to every response
// we ask the mouth to make — including the ones WE trigger to speak Chief's later
// sentences. Left alone, that forces the mouth to call ask_chief AGAIN on its own
// follow-up text, which re-enters Chief's own words as if Neill had said them. Every
// response WE open below turns tool_choice off for just that one response.

// Response ids WE opened (the tool's answer, and every "(Chief continues:)" follow-up).
// When the mouth's own transcript for one of these comes back, we already showed that
// exact text the moment it streamed in — see the "sentence" handling below — so that
// transcript bubble is a duplicate and gets swallowed once, here.
const ownResponseIds = new Set();

// Exactly one ask_chief call is "live" at a time. If Neill talks again before Chief's
// answer finishes, or before all of it has been spoken, the OLD invocation's queue and
// pacing must not keep leaking sentences into the new conversation — that was a real
// bug (two overlapping asks sharing one global queue, interleaving their sentences).
// So every invocation gets its own queue/pacing state, and a new one always aborts
// whatever the previous one was still doing first.
let activeInvocation = null;

function newInvocation() {
  if (activeInvocation) activeInvocation.abort();
  const inv = {
    controller: new AbortController(),
    cancelled: false,
    mouthBusy: false,      // true while we're waiting for OUR OWN open response to finish
    queue: [],              // later sentences, waiting their turn to be spoken
    openResponseId: null,   // the response id mouthBusy is tied to
    awaitingResponseId: false,
    watchdog: null,
    abort() {
      this.cancelled = true;
      this.controller.abort();
      this.queue.length = 0;
      if (this.watchdog) { clearTimeout(this.watchdog); this.watchdog = null; }
    },
  };
  activeInvocation = inv;
  return inv;
}

function clearOpenResponse(inv) {
  inv.mouthBusy = false;
  inv.openResponseId = null;
  inv.awaitingResponseId = false;
  if (inv.watchdog) { clearTimeout(inv.watchdog); inv.watchdog = null; }
}

function openMouthResponse(inv, extra) {
  if (!dc || inv.cancelled) return;
  inv.mouthBusy = true;
  inv.awaitingResponseId = true;
  // A watchdog: if the realtime side never tells us this response finished (a
  // swallowed error, road noise triggering "already has an active response", a dropped
  // event) the queue must not go silent forever — one bad turn should cost 15 seconds,
  // not the rest of the drive.
  inv.watchdog = setTimeout(() => {
    clearOpenResponse(inv);
    pumpQueue(inv);
  }, 15000);
  dc.send(JSON.stringify(Object.assign({ type: 'response.create' }, extra || {})));
}

function sendFunctionCallOutput(inv, callId, answerText) {
  if (!dc || inv.cancelled) return;
  dc.send(JSON.stringify({
    type: 'conversation.item.create',
    item: { type: 'function_call_output', call_id: callId,
            output: JSON.stringify({ answer: answerText }) }
  }));
  openMouthResponse(inv);
}

function pumpQueue(inv) {
  if (inv.cancelled || inv.mouthBusy || !inv.queue.length || !dc) return;
  const text = inv.queue.shift();
  dc.send(JSON.stringify({
    type: 'conversation.item.create',
    item: { type: 'message', role: 'user',
            content: [{type: 'input_text', text: '(Chief continues:) ' + text}] }
  }));
  openMouthResponse(inv, { response: { tool_choice: 'none' } });
}

function setState(cls, label) {
  $('#state').className = 'state ' + cls;
  $('#stateLabel').textContent = label;
}
function turn(cls, who, text) {
  $('#hint')?.remove();
  const d = document.createElement('div');
  d.className = 'turn ' + cls;
  d.innerHTML = `<div class="lbl">${who}</div>${(text||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}`;
  $('#log').appendChild(d);
  d.scrollIntoView({behavior:'smooth', block:'end'});
  return d;
}

$('#mic').onclick = () => live ? stop() : start();

async function start() {
  $('#mic').disabled = true;
  setState('think', 'connecting');
  try {
    // A short-lived token, minted by our Mac. The real key never touches this browser.
    const tok = await fetch('/api/voice/token').then(r => r.json());
    if (tok.error) throw new Error(tok.error);
    const key = tok.value || tok.client_secret?.value;

    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    pc = new RTCPeerConnection();
    // Chief's voice comes back over this.
    const audio = new Audio();
    audio.autoplay = true;
    audio.setAttribute('playsinline', '');   // iOS refuses to play inline without this
    pc.ontrack = e => { audio.srcObject = e.streams[0]; };
    pc.addTrack(stream.getAudioTracks()[0], stream);

    dc = pc.createDataChannel('oai-events');
    dc.onmessage = e => handle(JSON.parse(e.data));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const r = await fetch('https://api.openai.com/v1/realtime/calls', {
      method: 'POST',
      body: offer.sdp,
      headers: { Authorization: `Bearer ${key}`, 'Content-Type': 'application/sdp' },
    });
    await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() });

    live = true;
    $('#mic').textContent = 'Stop';
    $('#mic').classList.add('on');
    setState('live', 'listening');
  } catch (err) {
    setState('bad', 'failed');
    turn('chief', 'Chief', "Couldn't start the microphone. " + err.message);
  }
  $('#mic').disabled = false;
}

function stop() {
  activeInvocation?.abort();   // don't leave a fetch or a watchdog timer running after hangup
  pc?.close(); stream?.getTracks().forEach(t => t.stop());
  pc = stream = dc = null; live = false;
  $('#mic').textContent = 'Start talking';
  $('#mic').classList.remove('on');
  setState('', 'off');
}

async function handle(ev) {
  // What Neill said.
  if (ev.type === 'conversation.item.input_audio_transcription.completed') {
    lastSaid = ev.transcript;
    turn('you', 'You', ev.transcript);
  }

  // The mouth is reaching for Chief. This is the ONLY thing it's allowed to do.
  if (ev.type === 'response.function_call_arguments.done' && ev.name === 'ask_chief') {
    const args = JSON.parse(ev.arguments || '{}');
    const said = (args.said || lastSaid || '').trim();

    if (said.startsWith('(Chief continues:)')) {
      // Belt-and-braces: tool_choice:'none' on every follow-up response (see
      // pumpQueue) should stop this from ever firing, but if the mouth still calls
      // ask_chief on its OWN follow-up sentence, this stops Chief's own words from
      // re-entering the conversation as something Neill said. Deliberately does not
      // answer the pending tool call back — a repeat like this should be rare enough
      // that leaving it unanswered is safer than teaching the mouth a new shape here.
      turn('hold', 'Chief', 'skipped a repeat of its own answer');
      return;
    }

    setState('think', 'thinking');
    const hold = turn('hold', 'Chief', 'thinking…');
    let sawSentence = false, sawDone = false;
    const inv = newInvocation();

    try {
      const resp = await fetch('/api/voice/ask/stream', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          said: args.said || lastSaid, context: lastAnswer, project: args.project
        }),
        signal: inv.controller.signal,
      });
      if (!resp.ok || !resp.body) throw new Error('voice stream failed');

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      const takeEvent = frame => {
        if (inv.cancelled) return;
        let name = '', data = '';
        for (const line of frame.split('\n')) {
          if (line.startsWith('event: ')) name = line.slice(7);
          if (line.startsWith('data: ')) data += line.slice(6);
        }
        if (!name || !data) return;
        const out = JSON.parse(data);

        if (name === 'sentence') {
          hold.remove();
          turn('chief', 'Chief', out.text);
          if (!sawSentence) {
            sawSentence = true;
            sendFunctionCallOutput(inv, ev.call_id, out.text);
          } else {
            inv.queue.push(out.text);
            pumpQueue(inv);
          }
        }

        if (name === 'done') {
          sawDone = true;
          hold.remove();
          lastAnswer = out.full || out.spoken;
          if (out.failed && !sawSentence) {
            turn('chief', 'Chief', out.spoken);
            sendFunctionCallOutput(inv, ev.call_id, out.spoken);
          }
          setState('live', 'listening');
        }
      };

      while (true) {
        if (inv.cancelled) return;
        const {value, done} = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
        let cut;
        while ((cut = buffer.indexOf('\n\n')) !== -1) {
          if (inv.cancelled) return;
          takeEvent(buffer.slice(0, cut));
          buffer = buffer.slice(cut + 2);
        }
        if (done) break;
      }
      if (buffer.trim()) takeEvent(buffer.trim());
      if (!sawDone && !inv.cancelled) throw new Error('voice stream ended early');
    } catch (err) {
      hold.remove();
      // Neill talked over it (barge-in aborted this invocation) — say nothing extra,
      // the interruption itself is the answer. Same if the turn already finished
      // normally before this error landed; re-answering an already-answered call
      // would be a second, confusing reply to the same question.
      if (inv.cancelled || sawDone) return;

      if (sawSentence) {
        // The mouth already answered the tool call once — a call_id can only be
        // answered once. Any later failure has to land as a normal follow-up,
        // paced the same as everything else, not a second function_call_output.
        const fallback = "Something went wrong on my end. Nothing's started.";
        turn('chief', 'Chief', fallback);
        inv.queue.push(fallback);
        pumpQueue(inv);
      } else {
        // The streaming path never got a single word out. Try the plain,
        // non-streaming path once before giving up — slower, but slower-and-answered
        // beats fast-and-silent.
        let spoken = "Something went wrong on my end. Nothing's started.";
        try {
          const plain = await fetch('/api/voice/ask', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              said: args.said || lastSaid, context: lastAnswer, project: args.project
            }),
          }).then(r => r.json());
          if (plain && plain.spoken) {
            spoken = plain.spoken;
            lastAnswer = plain.full || plain.spoken;
          }
        } catch (fallbackErr) {
          // Both paths are down — say so, plainly, and stop.
        }
        turn('chief', 'Chief', spoken);
        sendFunctionCallOutput(inv, ev.call_id, spoken);
      }
      setState('live', 'listening');
    }
  }

  if (ev.type === 'response.created') {
    const inv = activeInvocation;
    if (inv && inv.awaitingResponseId) {
      inv.openResponseId = ev.response?.id ?? null;
      if (inv.openResponseId) ownResponseIds.add(inv.openResponseId);
      inv.awaitingResponseId = false;
    }
  }

  if (ev.type === 'response.done' || ev.type === 'response.cancelled') {
    const inv = activeInvocation;
    if (inv && ev.response?.id === inv.openResponseId) {
      clearOpenResponse(inv);
      pumpQueue(inv);
    }
  }

  if (ev.type === 'input_audio_buffer.speech_started') {
    // Barge-in: stop queuing more of Chief's own sentences, and stop the in-flight
    // stream from pushing any more in behind Neill's back.
    activeInvocation?.abort();
  }

  // What Chief said back, once the mouth has finished saying it. Suppressed for any
  // response WE opened (the tool answer, or a "(Chief continues:)" follow-up) — that
  // exact text already appeared the instant it streamed in, above. Without this the
  // panel would show every sentence twice: once as Chief's own words, once as the
  // mouth's transcript of speaking them.
  if (ev.type === 'response.output_audio_transcript.done') {
    if (ownResponseIds.has(ev.response_id)) {
      ownResponseIds.delete(ev.response_id);
    } else {
      turn('chief', 'Chief', ev.transcript);
    }
  }

  if (ev.type === 'error') {
    setState('bad', 'error');
    turn('chief', 'Chief', ev.error?.message || 'Something went wrong.');
    // A realtime error (e.g. road noise triggering "already has an active response")
    // doesn't always come with a matching response.done, and mouthBusy latching true
    // forever would silence every sentence after it for the rest of the drive.
    if (activeInvocation) { clearOpenResponse(activeInvocation); pumpQueue(activeInvocation); }
  }
}
</script>
</body>
</html>
